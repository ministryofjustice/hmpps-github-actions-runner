name: Build and push the runner image

on:
  workflow_call:
    inputs:
      push:
        description: Whether to push the built image to registry
        type: boolean
        default: false

    outputs:
      version:
        description: The version of the app as generated by create_app_version
        value: ${{ jobs.build-runner.outputs.version }}

  workflow_dispatch:
    inputs:
      push:
        description: Whether to push the built image to registry
        type: boolean
        default: false

jobs:
  build-runner:
    permissions:
      contents: read
      pull-requests: write
      deployments: write
      packages: write
    name: Docker build
    outputs: 
      version: ${{ steps.app_version.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: app_version
        name: Application version creators
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/build-test-and-deploy/create_app_version@6ca6653862e916a9221d915216228aee57717570 # WORKFLOW_VERSION
      - name: Build Docker images
        uses: ./.github/actions/docker-build
        id: build
        with:
          project: 'hmpps-github-actions-runner'
          push: ${{ inputs.push }}
          version: ${{ steps.app_version.outputs.version }}

  delete-old-runner-images:
    runs-on: ubuntu-latest
    if: inputs.push == true
    needs:
      build-runner
    steps:
      - name: Delete old gchr.io images for runner
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: hmpps-github-actions-runner
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
    permissions:
      contents: read
      packages: write
      pull-requests: write