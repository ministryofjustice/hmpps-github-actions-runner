name: Remove offline runners

on:
  workflow_call:

jobs:
  remove-offline-runners:
    runs-on: ubuntu-26.04
    name: Remove offline runners
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: GitHub app installation access token generation
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: generate-github-app-tokens
      with:
        client-id: ${{ secrets.GH_APP_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
        owner: ministryofjustice
    - name: runner cleanup
      uses: ./.github/actions/runner-cleanup
      with:
        gh_auth_token: ${{ steps.generate-github-app-tokens.outputs.token }}
        github_org: ${{ github.repository_owner }}
        runner_label: ${{ vars.RUNNER_LABEL }}
